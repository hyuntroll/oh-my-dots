<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OhMyDots · 로그인</title><link rel="stylesheet" href="/service-assets/service.css"><body><main class="auth"><div class="card"><a class="brand" href="/"><span class="mark" aria-hidden="true">·</span>OhMyDots</a><h1 id="title">다시 만나서 반가워요</h1><p id="description">내 계정으로 로그인하고 Dots와 대화를 이어가세요.</p><form id="login"><label id="setup-code" hidden>초기 설정 코드<input name="setupCode" autocomplete="off" type="password"></label><label>아이디<input name="username" required minlength="3" maxlength="64" autocomplete="username" autocapitalize="none" spellcheck="false"></label><label id="display-name" hidden>표시 이름<input name="displayName" maxlength="100" autocomplete="nickname"></label><label>비밀번호<input name="password" type="password" required maxlength="1024" autocomplete="current-password"></label><label id="confirm-password" hidden>비밀번호 확인<input name="confirmPassword" type="password" autocomplete="new-password"></label><p id="error" class="alert" role="alert"></p><button class="primary" type="submit">로그인</button></form><p class="small" id="setup-hint" hidden>서버의 bootstrap.token 파일에 있는 코드를 입력해 첫 관리자 계정을 만드세요. 비밀번호는 12자 이상이어야 합니다.</p><button id="register" class="secondary" hidden>계정 만들기</button></div></main><script type="module" src="/service-assets/login.mjs"></script></body></html>
