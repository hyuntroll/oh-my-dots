<!doctype html><html lang="ko"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"><title>OhMyDots</title><style>
:root{color-scheme:dark;--bg:#181818;--ink:#ececec;--muted:#999;--hover:#ffffff0d}html[data-theme=light]{color-scheme:light;--bg:#f9f9f9;--ink:#212121;--muted:#777;--hover:#00000009}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:12px -apple-system,BlinkMacSystemFont,sans-serif}header{position:relative;height:40px;display:flex;align-items:center;padding:0 12px 0 88px;-webkit-app-region:drag;background:var(--bg)}.brand{position:absolute;left:50%;transform:translateX(-50%);font-weight:500;color:var(--muted)}.tools{margin-left:auto;display:flex;gap:4px}button{-webkit-app-region:no-drag;border:0;border-radius:7px;color:var(--muted);background:transparent;cursor:pointer}button:hover{background:var(--hover);color:var(--ink)}.tools button{width:28px;height:28px;font-size:18px}button:focus-visible{outline:2px solid #6ca6e8;outline-offset:2px}main{height:calc(100vh - 40px);display:flex;align-items:center;justify-content:center;text-align:center}main p{color:var(--muted);line-height:1.7}main button{background:var(--hover);padding:10px 18px;font-size:13px;color:var(--ink)}.spinner{width:22px;height:22px;border:2px solid var(--hover);border-top-color:var(--muted);border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}[hidden]{display:none!important}
</style><header><span class="brand">OhMyDots</span><div class="tools"><button data-action="reload" title="새로고침" aria-label="새로고침">↻</button><button data-action="menu" title="더 보기" aria-label="더 보기">⋯</button></div></header><main><div><div class="spinner"></div><h3 id="message">OhMyDots를 여는 중</h3><p id="detail">컴퓨터와 대화에 연결하고 있습니다.</p><button id="retry" data-action="reload" hidden>다시 연결</button></div></main><script src="shell.js"></script></html>
