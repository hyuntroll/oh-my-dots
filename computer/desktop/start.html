<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OhMyDots</title>
<style>
:root{color-scheme:light;font-family:Inter,'Noto Sans CJK KR',sans-serif;color:#59483f;background:#f9efe9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f9efe9;overflow:hidden}main{text-align:center;padding:40px 24px;width:min(650px,100%);position:relative;z-index:1}.pet{width:170px;height:170px;object-fit:contain;display:block;margin:-12px auto -12px}.clock{font-size:72px;line-height:1.1;font-weight:400;letter-spacing:-4px;font-variant-numeric:tabular-nums}.clock small{font-size:12px;letter-spacing:0;margin-left:7px}h1{font-size:22px;font-weight:400;margin:12px 0 44px}.links{display:grid;grid-template-columns:repeat(4,80px);justify-content:center;gap:32px 20px}a{color:#78675d;font-size:12px;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:9px}a:hover{color:#9e5038}.shortcut{width:46px;height:46px;background:#ffffffad;border-radius:12px;display:grid;place-items:center}.shortcut img{width:30px;height:30px}.speech{position:relative;text-align:left;width:236px;background:#fff;color:#4f4743;border-radius:20px;padding:15px 26px 15px 16px;font-size:12px;line-height:1.5;margin:0 auto -3px}.speech:after{content:'';position:absolute;left:58%;bottom:-9px;border-width:10px 10px 0;border-style:solid;border-color:white transparent transparent}.speech button{position:absolute;right:8px;top:7px;background:none;border:0;color:#aaa;font-size:17px;cursor:pointer}.botanical{position:fixed;inset:0;pointer-events:none}.botanical img{position:absolute;width:32px;height:32px;opacity:.43}@media(max-height:620px){main{padding:22px}.speech{font-size:11px;width:220px}.pet{width:120px;height:120px}.clock{font-size:58px}h1{font-size:19px;margin:10px 0 28px}.links{gap:24px 20px}}a:focus-visible,button:focus-visible{outline:2px solid #ac705b;outline-offset:5px}
.pet{animation:pet-float 5s ease-in-out infinite}a{transition:color 160ms,transform 180ms}a:hover{transform:translateY(-3px)}.speech{animation:speech-in 260ms ease-out}@keyframes pet-float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-5px) rotate(1deg)}}@keyframes speech-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}a:hover{transform:none}}
:root{--dot-accent:#bdc1d2}body{background:color-mix(in srgb,var(--dot-accent) 16%,white);transition:background-color 200ms}a:hover{color:var(--dot-accent)}
</style></head><body>
