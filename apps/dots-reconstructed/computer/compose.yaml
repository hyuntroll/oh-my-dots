name: dots-reconstructed
services:
  computer:
    build: .
    environment:
      COMPUTER_TOKEN: ${DOTS_COMPUTER_TOKEN:?Use npm run computer:start}
    ports: ["127.0.0.1:3480:8765"]
    volumes:
      - "${DOTS_WORKSPACES:?Use npm run computer:start}:/workspace"
      - "./entrypoint.sh:/app/entrypoint.sh:ro"
      - "./daemon.py:/app/daemon.py:ro"
    shm_size: 512m
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8765/health',headers={'Authorization':'Bearer '+os.environ['COMPUTER_TOKEN']}))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
