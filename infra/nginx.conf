events {}
http {
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 8080;
        deny 10.246.78.0/24;
        allow all;
        client_max_body_size 2m;
        # OAuth callback URLs contain short-lived codes; never log query strings.
        access_log off;
        location /api/ {
            proxy_pass http://api:18000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Dot-Bootstrap "${DOT_SESSION_TOKEN}";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
        location / { proxy_pass http://web:3081; proxy_set_header Host $host; }
    }
}
