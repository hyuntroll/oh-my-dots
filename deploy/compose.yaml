name: ohmydots
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ohmydots:local
    user: "${DOTS_UID:-1000}:${DOTS_GID:-1000}"
    environment:
      DOTS_SERVICE_CONFIG: /data/config.json
    volumes:
      - "${DOTS_SERVICE_DATA:?Run service setup first}:/data"
    ports:
      - "127.0.0.1:${DOTS_SERVICE_PORT:-3420}:3420"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');const c=JSON.parse(fs.readFileSync('/data/config.json'));fetch('http://127.0.0.1:3420/healthz',{headers:{Host:new URL(c.publicUrl).host}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  caddy:
    image: caddy:2.11.7@sha256:5e5286cb37d44086d651a5363f05f43a692ce4d649d88fb1bd844579f45fa9e8
    profiles: [tls]
    depends_on: [app]
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - "${DOTS_SERVICE_DATA:?Run service setup first}/Caddyfile:/etc/caddy/Caddyfile:ro"
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
