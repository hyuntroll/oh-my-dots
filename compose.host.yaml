# Production web/API run on the host, so the trusted control plane can create
# per-Dot containers without giving Docker access to any agent container.
services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DOT_DATABASE_PASSWORD:?Initialize hosting first}
    ports: !override ["127.0.0.1::5432"]
    networks: !override [backend, frontend]
  computer:
    restart: unless-stopped
    ports: !override ["127.0.0.1::8765", "127.0.0.1::6080"]
    volumes: !override [artifacts:/workspace/artifacts, computer-home:/home/dot]
    tmpfs: !override [/tmp, "/workspace:uid=1000,gid=1000"]
  shell:
    restart: unless-stopped
    ports: !override ["127.0.0.1::8766"]
  gateway:
    restart: unless-stopped
    ports: !override ["${DOT_BIND_ADDRESS:-127.0.0.1}:${DOT_PORT:-3080}:8080"]
    environment:
      DOT_API_PORT: ${DOT_API_PORT:?Initialize hosting first}
      DOT_WEB_PORT: ${DOT_WEB_PORT:?Initialize hosting first}
      DOT_SHELL_SUBNET: ${DOT_SHELL_SUBNET:-10.246.79.0/24}
    volumes: !override
      - ./infra/nginx.host.conf:/etc/ohmydot/nginx.conf.template:ro
      - ./infra/gateway.sh:/gateway.sh:ro
      - ./.local/hosting/htpasswd:/etc/nginx/dot.htpasswd:ro
    depends_on: !override [shell]
volumes:
  computer-home: {}
networks:
  backend:
    ipam:
      config: !override [{subnet: "${DOT_BACKEND_SUBNET:-10.247.0.0/24}"}]
  frontend:
    ipam:
      config: !override [{subnet: "${DOT_FRONTEND_SUBNET:-10.247.1.0/24}"}]
  desktop:
    ipam:
      config: !override [{subnet: "${DOT_DESKTOP_SUBNET:-10.247.2.0/24}"}]
  shell:
    ipam:
      config: !override [{subnet: "${DOT_SHELL_SUBNET:-10.246.79.0/24}"}]
  shell-egress:
    ipam:
      config: !override [{subnet: "${DOT_EGRESS_SUBNET:-10.247.4.0/24}"}]
