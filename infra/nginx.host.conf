events {}
http {
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 8080;
        deny ${DOT_SHELL_SUBNET};
        allow all;
        auth_basic "OhMyDots";
        auth_basic_user_file /etc/nginx/dot.htpasswd;
        client_max_body_size 2m;
        access_log off;
        location /api/ {
            proxy_pass http://host.docker.internal:${DOT_API_PORT};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Dot-Bootstrap "${DOT_SESSION_TOKEN}";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
        location / {
            proxy_pass http://host.docker.internal:${DOT_WEB_PORT};
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
